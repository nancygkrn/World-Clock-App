<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>World Clcok</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

          <select id="city">
        <option value="">Select a city..</option>
        <option value="Europe/London">London</option>
        <option value="America/New_York">New York</option>
        <option value="Pacific/Auckland">Auckland</option>
      </select>
<div id="cities">
      <div class="city" id="los-angeles">
        <div>
          <h2>Los Angeles 🇺🇸</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>

      <div class="city" id="berlin">
        <div>
          <h2>Berlin 🇩🇪</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>
      </div>
    </div>
    <footer>
      This project was coded with ❤️ by <strong> Nancy G</strong>, is

        open sourced on GitHub</a
      >
      and is availanle on
      <a href="https://world-clock-app-nancyg.netlify.app/" target="_blank">
        Netlify</a
      >
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
